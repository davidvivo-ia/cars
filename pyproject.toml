[project]
name = "highway"
version = "1.0.0"
description = "Road Racer 2026 — reinterpretación moderna de un type-in BASIC de ZX Spectrum"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "highway maintainers" }]
requires-python = ">=3.13"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "textual>=0.78",
  "pydantic>=2.7",
  "structlog>=24.1",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "textual-dev>=1.5",
]

[project.scripts]
highway = "highway.presentation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highway"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",       # pycodestyle / pyflakes
  "I",                  # isort
  "B",                  # bugbear
  "UP",                 # pyupgrade
  "ANN",                # annotations
  "RUF",                # ruff
  "SIM",                # simplify
  "PT",                 # pytest
  "PL",                 # pylint subset
  "TID",                # tidy imports
]
ignore = [
  "ANN401",   # Any allowed in narrow boundaries
  "PLR2004",  # magic values in tests/cases ok
  "PLR0913",  # many args sometimes ok in builders
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/highway"]

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]
